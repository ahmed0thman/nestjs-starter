services:
  postgres_db:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - "${DATABASE_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data: